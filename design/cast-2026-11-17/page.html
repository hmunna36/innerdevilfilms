<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: "IDF Sans"; src: url("../../engine/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-style: normal; }
@font-face { font-family: "IDF Serif"; src: url("../../engine/fonts/Gelasio.ttf") format("truetype"); font-weight: 400 700; font-style: normal; }
@font-face { font-family: "IDF Serif"; src: url("../../engine/fonts/Gelasio-Italic.ttf") format("truetype"); font-weight: 400 700; font-style: italic; }
html, body { margin: 0; background: #000; } canvas { display: block; }
</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script>
<script>
(async () => {
  try {
    const d = new URLSearchParams(location.search).get('dir');
    await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = d + '.js'; s.onload = ok; s.onerror = () => bad(new Error('cannot load ' + d + '.js')); document.head.appendChild(s); });
    await Promise.all(['300 40px "IDF Sans"', '900 40px "IDF Sans"', 'italic 600 40px "IDF Serif"', '600 40px "IDF Serif"'].map(f => document.fonts.load(f)));
    window.READY = true;
  } catch (e) { window.LOAD_ERROR = String(e && e.message || e); }
})();
window.DRAW = (name, t) => { const c = document.getElementById('c'); ctx = c.getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.clearRect(0, 0, W, H); STILLS[name](t || 0); };
</script></body></html>
