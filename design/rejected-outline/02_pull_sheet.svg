17181c" stroke-width="18"/><path d="M-26.0,-206.0 Q0.0,-220.0 26.0,-206.0 L22.0,-112.0 Q0.0,-102.0 -22.0,-112.0 Z" fill="#17181c"/><rect x="-15" y="-220" width="30" height="18" rx="8" fill="#17181c"/><path d="M-13,-208 h26" stroke="#ecebe4" stroke-width="2" opacity=".55"/><g transform="translate(6,-252) rotate(4)"><ellipse cx="0" cy="0" rx="37" ry="45" fill="#17181c" stroke="#ecebe4" stroke-width="3.2"/><path d="M-4,-39 q-4,-16 -16,-20 M3,-40 q2,-19 -6,-29 M10,-38 q8,-12 4,-24" fill="none" stroke="#ecebe4" stroke-width="3.2" stroke-linecap="round"/><path d="M8,2 h8" fill="none" stroke="#ecebe4" stroke-width="3.8000000000000003" stroke-linecap="round"/><path d="M22,2 h8" fill="none" stroke="#ecebe4" stroke-width="3.8000000000000003" stroke-linecap="round"/></g></g><text x="1550" y="690" fill="#f2a33a" font-family="Avenir Next" font-size="22" font-weight="500" text-anchor="middle">4 · it is him</text><text x="80" y="800" fill="#ecebe4" font-family="Avenir Next" font-size="24" font-weight="600" text-anchor="start">ITS VOICE</text><text x="80" y="850" fill="#f2a33a" font-family="Courier New" font-size="34" font-weight="500" text-anchor="start">just one look.</text><text x="80" y="895" fill="#f2a33a" font-family="Courier New" font-size="34" font-weight="500" text-anchor="start">you've earned a minute.</text><text x="80" y="945" fill="#5d6068" font-family="Avenir Next" font-size="21" font-weight="500" text-anchor="start">Typewriter, amber, lowercase, types on letter by letter with a soft key tick.</text><text x="80" y="975" fill="#5d6068" font-family="Avenir Next" font-size="21" font-weight="500" text-anchor="start">The narrator is the opposite: white Avenir, sentence case, centred at the bottom.</text><text x="1000" y="800" fill="#5d6068" font-family="Avenir Next" font-size="21" font-weight="500" text-anchor="start">• it has the one thing he lacks: a mouth (a thin smile)</text><text x="1000" y="840" fill="#5d6068" font-family="Avenir Next" font-size="21" font-weight="500" text-anchor="start">• it never walks, it pays out thread; when it loses, the thread goes slack</text><text x="1000" y="880" fill="#5d6068" font-family="Avenir Next" font-size="21" font-weight="500" text-anchor="start">• it grows more solid as it wins (1 → 4); stage 4 gets his cowlick: the reveal</text><text x="1000" y="920" fill="#5d6068" font-family="Avenir Next" font-size="21" font-weight="500" text-anchor="start">• amber = the struggle, everywhere: its body, its words, the counter when it climbs</text><text x="1000" y="960" fill="#5d6068" font-family="Avenir Next" font-size="21" font-weight="500" text-anchor="start">• it casts light; he casts none. Its glow is the only warm light in a scene</text><rect width="1920" height="1080" filter="url(#grain)"/></svg>