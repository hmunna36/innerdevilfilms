<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUST — It Watches Back</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #050506; color: #e9e4da;
    font: 14px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; min-height: 100vh; }
  #stage, #ui { width: min(100%, calc((100vh - 150px) * 16 / 9)); }
  #stage { aspect-ratio: 16 / 9; background: #000; box-shadow: 0 20px 60px rgba(0, 0, 0, .6); }
  canvas { width: 100%; height: 100%; display: block; }
  #ui { display: grid; grid-template-columns: auto 1fr auto; gap: 10px 14px; align-items: center; }
  button { background: #16171b; color: #e9e4da; border: 1px solid #2a2b31; border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: #4a4b52; }
  button.on { background: #e9a948; color: #120c06; border-color: #e9a948; }
  #play { width: 46px; }
  input[type=range] { width: 100%; accent-color: #e9a948; }
  #time { font-variant-numeric: tabular-nums; min-width: 96px; text-align: right; color: #a9a49b; }
  #phases { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #phases label { margin-left: auto; color: #a9a49b; display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="ui">
  <button id="play" title="Play / pause (space)">▶</button>
  <input id="scrub" type="range" min="0" max="110.5" step="0.01" value="0" aria-label="Timeline">
  <span id="time">0:00 / 1:50</span>
  <div id="phases"></div>
</div>
<script>
'use strict';
// LUST: code-drawn motion graphics. Every frame is a pure function of time t (seconds),
// so scrubbing is exact and frames can be exported one by one with renderAt(t).
const W = 1920, H = 1080, DUR = 110.5;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- maths ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, v) => clamp((v - a) / (b - a));
const E = {
  io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  out: k => 1 - Math.pow(1 - k, 3),
  sine: k => -(Math.cos(Math.PI * k) - 1) / 2,
  lin: k => k
};
// 1 inside [a, b] with eased fades of fi / fo seconds, 0 outside
const win = (t, a, b, fi = .6, fo = .6) => t < a || t > b ? 0 :
  Math.min(fi > 0 ? E.sine(inv(a, a + fi, t)) : 1, fo > 0 ? E.sine(inv(b, b - fo, t)) : 1);
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const mix = (c1, c2, k) => [lerp(c1[0], c2[0], k), lerp(c1[1], c2[1], k), lerp(c1[2], c2[2], k)];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a)})`;
// eased lookup over [[t, v1, v2…], …]; values may be numbers or colours
function keys(list, t, f = E.sine, j = 1) {
  if (t <= list[0][0]) return list[0][j];
  for (let i = 1; i < list.length; i++) {
    if (t <= list[i][0]) {
      const k = f(inv(list[i - 1][0], list[i][0], t)), a = list[i - 1][j], b = list[i][j];
      return Array.isArray(a) ? mix(a, b, k) : lerp(a, b, k);
    }
  }
  return list[list.length - 1][j];
}

// ---------- look ----------
const C = {
  black: [4, 4, 6], night: [8, 9, 14], cream: [238, 230, 214], red: [232, 44, 52], blood: [110, 10, 18],
  blue: [150, 185, 255], amber: [255, 168, 70], gold: [255, 212, 140], grey: [150, 150, 156]
};
const HAND = '"Bradley Hand", "Segoe Print", "Noteworthy", "Marker Felt", cursive';
const SANS = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const SERIF = 'Georgia, "Times New Roman", serif';

// ---------- story data (times match LUST_screenplay.md) ----------
const PHASES = [
  { name: 'Cold open', a: 0, b: 4 },
  { name: 'Night 1', a: 4, b: 14 },
  { name: 'Nights 2–4', a: 14, b: 43 },
  { name: 'It shows itself', a: 43, b: 60.6 },
  { name: 'He fights back', a: 60.6, b: 95.5 },
  { name: 'Weeks later', a: 95.5, b: 110.5 }
];
// every line is the devil's: soft and kind until 0:44, then its real voice
const VO = [
  { id: 'VO01', t: .1, d: 1.8, text: 'You think you’re alone when you watch it… don’t you?' },
  { id: 'VO02', t: 5.1, d: 2.2, text: 'Shh… it’s okay. Everyone does it.' },
  { id: 'VO03', t: 8, d: 2.3, text: 'You worked hard today. You deserve this.' },
  { id: 'VO04', t: 11.3, d: 1.8, text: 'Just one more. Then sleep.' },
  { id: 'VO05', t: 14.9, d: 2.2, text: 'She’ll call again. Stay with me.' },
  { id: 'VO06', t: 19.3, d: 2, text: 'See? You feel better already.' },
  { id: 'VO07', t: 22.9, d: 2.2, text: 'Who needs them? You have me.' },
  { id: 'VO08', t: 27.3, d: 2, text: 'I’ll never leave you.' },
  { id: 'VO09', t: 32.6, d: 3.6, text: 'She’d never understand you… not like I do.' },
  { id: 'VO10', t: 39.95, d: 2.8, text: 'One more… one more… one more…' },
  { id: 'VO11', t: 44.1, d: 2, text: 'I was never in the phone.' },
  { id: 'VO12', t: 46.7, d: 1.9, text: 'I was always… in you.' },
  { id: 'VO13', t: 50.75, d: 2.3, text: 'Every night… you fed me.' },
  { id: 'VO14', t: 53.2, d: 1.8, text: 'Now you’re mine.' },
  { id: 'VO15', t: 55.2, d: 1.4, text: '(it screams)' },
  { id: 'VO16', t: 61.6, d: 2.2, text: 'Come back… just once.' },
  { id: 'VO17', t: 68, d: 1.8, text: 'You’ll get tired.' },
  { id: 'VO18', t: 84.3, d: 1.2, text: 'Just one look…' },
  { id: 'VO19', t: 88.3, d: 1.1, text: '(it shrieks)' },
  { id: 'VO20', t: 93.1, d: 1.6, text: 'Tomorrow, then.' },
  { id: 'VO21', t: 100.3, d: 1.2, text: 'I’ll wait.' }
];
// moments that hit: each one shakes the frame briefly
const SLAMS = [3.4, 48.6, 51, 54.8, 55.15, 60.6, 84.3, 103.9, 105.9];
// glitch tears: [start, end, strength]
const GLITCH = [[3.4, 4, 1], [42.6, 43.1, .9], [55.15, 55.6, 1], [58.6, 59.2, .7], [84.3, 84.6, .8], [88.2, 88.6, .7], [101.7, 102.3, 1]];

// ---------- glow sprites, stamped with additive blending ----------
function sprite(c, size = 128) {
  const s = document.createElement('canvas'); s.width = s.height = size;
  const g = s.getContext('2d'), r = size / 2, grd = g.createRadialGradient(r, r, 0, r, r, r);
  grd.addColorStop(0, rgba(c, 1)); grd.addColorStop(.28, rgba(c, .5)); grd.addColorStop(1, rgba(c, 0));
  g.fillStyle = grd; g.fillRect(0, 0, size, size);
  return s;
}
const SPR = {};
for (const k of ['red', 'amber', 'gold', 'grey', 'blue', 'cream']) SPR[k] = sprite(C[k]);
function glow(spr, x, y, r, a) {
  if (a <= .003 || r <= 0) return;
  const g0 = ctx.globalAlpha;
  ctx.globalAlpha = g0 * Math.min(1, a);
  ctx.drawImage(spr, x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = g0;
}
function additive(fn) {
  const o = ctx.globalCompositeOperation;
  ctx.globalCompositeOperation = 'lighter'; fn(); ctx.globalCompositeOperation = o;
}

// ---------- camera: framings are hard cuts; slams shake the frame ----------
let SHX = 0, SHY = 0;
function setShake(t) {
  let a = 0;
  for (const s of SLAMS) if (t >= s && t < s + .4) a = Math.max(a, 16 * (1 - inv(s, s + .4, t)));
  SHX = a ? Math.sin(t * 91) * a : 0; SHY = a ? Math.cos(t * 77) * a * .7 : 0;
}
let PUSH = 1;                        // a slow push-in on every shot, set per frame
function cam(z = 1, cx = W / 2, cy = H / 2) { const k = z * PUSH; ctx.setTransform(k, 0, 0, k, W / 2 - cx * k + SHX, H / 2 - cy * k + SHY); }
function screen() { ctx.setTransform(PUSH, 0, 0, PUSH, W / 2 * (1 - PUSH) + SHX, H / 2 * (1 - PUSH) + SHY); }
// the framing in force at time t, from [[start, z, cx, cy], …]
function shotAt(list, t) { let s = list[0]; for (const x of list) if (t >= x[0]) s = x; return s; }
function glitch(t, extra = 0) {     // horizontal tears across the frame
  let amt = extra;
  for (const [a, b, s] of GLITCH) if (t >= a && t <= b) amt = Math.max(amt, s * Math.sin(Math.PI * inv(a, b, t)));
  if (amt <= .02) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const seed = Math.floor(t * 24);
  for (let i = 0; i < 9; i++) {
    const y = rnd(seed * 13 + i) * H, h = 8 + rnd(seed * 7 + i) * 60, dx = (rnd(seed * 3 + i) - .5) * 160 * amt;
    ctx.drawImage(cv, 0, y, W, h, dx, y, W, h);
  }
  ctx.fillStyle = rgba(C.red, .08 * amt); ctx.fillRect(0, 0, W, H);
}

// ---------- shapes and type ----------
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, Math.max(0, h), Math.max(0, Math.min(r, w / 2, Math.abs(h) / 2)));
  else ctx.rect(x, y, w, h);
}
function font(size, fam = SANS, weight = '400', style = 'normal') { ctx.font = `${style} ${weight} ${size}px ${fam}`; }
// handwriting that writes itself on: k 0→1 reveals the letters left to right; returns the full width
function hand(txt, x, y, size, col, a, k = 1, align = 'left', glowA = 0) {
  font(size, HAND);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const full = ctx.measureText(txt).width;
  if (a <= .003 || k <= 0) return full;
  const x0 = align === 'center' ? x - full / 2 : align === 'right' ? x - full : x;
  const f = txt.length * clamp(k), n = Math.floor(f), shown = txt.slice(0, n);
  if (glowA > 0) { ctx.shadowColor = rgba(col, glowA * a); ctx.shadowBlur = size * .5; }
  ctx.fillStyle = rgba(col, a);
  ctx.fillText(shown, x0, y);
  if (n < txt.length) { ctx.fillStyle = rgba(col, a * (f - n)); ctx.fillText(txt[n], x0 + ctx.measureText(shown).width, y); }
  ctx.shadowBlur = 0;
  return full;
}
// tracked capitals centred on x; returns the width
function spaced(txt, x, y, size, col, a, track = 0, weight = '800', glowA = 0, fam = SANS) {
  font(size, fam, weight);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const chars = [...txt], ws = chars.map(ch => ctx.measureText(ch).width);
  const total = ws.reduce((s, w) => s + w, 0) + track * (chars.length - 1);
  if (a <= .003) return total;
  let cx = x - total / 2;
  if (glowA > 0) { ctx.shadowColor = rgba(col, glowA * a); ctx.shadowBlur = size * .35; }
  ctx.fillStyle = rgba(col, a);
  chars.forEach((ch, i) => { ctx.fillText(ch, cx, y); cx += ws[i] + track; });
  ctx.shadowBlur = 0;
  return total;
}

// a line of capitals that slams in at t0: oversized, then snaps to size in .15 s
function slam(txt, x, y, size, col, a, t0, t, track = 8, weight = '800', glowA = 0) {
  if (t < t0 || a <= .003) return 0;
  const sc = 1 + .28 * (1 - E.out(inv(t0, t0 + .15, t)));
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  const w = spaced(txt, 0, 0, size, col, a * inv(t0, t0 + .06, t), track, weight, glowA);
  ctx.restore();
  return w;
}

// ---------- the man: a silhouette made of round-capped strokes ----------
function limb(pts, w) {
  ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}
// rim light: the same shape a little larger, nudged toward the light, drawn first in the light's colour
function drawPerson(P, fill, rim, rimA, lx = 0, ly = -1) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const pass = (dx, dy, col, extra) => {
    ctx.strokeStyle = col; ctx.fillStyle = col;
    for (const [pts, w] of P.parts) limb(pts.map(p => [p[0] + dx, p[1] + dy]), w + extra);
    ctx.beginPath(); ctx.arc(P.head[0] + dx, P.head[1] + dy, P.head[2] + extra / 2, 0, Math.PI * 2); ctx.fill();
  };
  if (rimA > .003) pass(lx * 5, ly * 5, rgba(rim, rimA), 4);
  pass(0, 0, rgba(fill), 0);
}
// sitting on the bed edge, facing right; h = hunch (0 upright … 1 folded over the phone)
function poseSit(x, y, s, h) {
  const sh = [x + (16 + 46 * h) * s, y - (168 - 44 * h) * s];
  const hd = [sh[0] + (20 + 44 * h) * s, sh[1] - (64 - 38 * h) * s];
  const knee = [x + 108 * s, y - 4 * s], foot = [x + 120 * s, y + 92 * s];
  const elbow = [sh[0] + (34 + 14 * h) * s, sh[1] + (70 - 10 * h) * s];
  const hand = [x + (100 + 8 * h) * s, y - (50 + 12 * (1 - h)) * s];
  return {
    head: [hd[0], hd[1], 40 * s], hand,
    parts: [
      [[[x, y], [x + (4 - 10 * h) * s, y - 90 * s], sh], 58 * s],
      [[[x - 10 * s, y + 4 * s], [knee[0] - 16 * s, knee[1] + 8 * s], [foot[0] - 24 * s, foot[1]]], 36 * s],
      [[[x, y], knee, foot], 40 * s],
      [[sh, elbow, hand], 24 * s]
    ]
  };
}
// standing, seen from behind; y = hip height, feet at y + 188·s; turn moves the head to the right
function poseStand(x, y, s, turn = 0, breathe = 0) {
  const sh = y - 186 * s - breathe * 3 * s;
  return {
    head: [x + turn * 16 * s, sh - 66 * s, 40 * s],
    parts: [
      [[[x, y - 8 * s], [x, sh + 10 * s]], 74 * s],
      [[[x - 40 * s, sh + 8 * s], [x + 40 * s, sh + 8 * s]], 34 * s],
      [[[x - 20 * s, y], [x - 26 * s, y + 188 * s]], 34 * s],
      [[[x + 20 * s, y], [x + 26 * s, y + 188 * s]], 34 * s],
      [[[x - 46 * s, sh + 14 * s], [x - 58 * s, sh + 100 * s], [x - 60 * s, sh + 176 * s]], 22 * s],
      [[[x + 46 * s, sh + 14 * s], [x + 58 * s, sh + 100 * s], [x + 60 * s, sh + 176 * s]], 22 * s]
    ]
  };
}
// walking / running in profile toward the right; ph = stride phase (radians), y = ground line
function poseWalk(x, y, s, ph, run = 0) {
  const amp = .42 + .3 * run, lean = .06 + .2 * run, L = 98 * s;
  const leg = p => {
    const th = Math.sin(p) * amp, bend = .12 + (.55 + .6 * run) * Math.max(0, Math.cos(p));
    const knee = [Math.sin(th) * L, Math.cos(th) * L];
    return [knee, [knee[0] + Math.sin(th - bend) * L, knee[1] + Math.cos(th - bend) * L]];
  };
  const A = leg(ph), B = leg(ph + Math.PI);
  const hip = [x, y - Math.max(A[1][1], B[1][1])];          // the lower foot touches the ground
  const at = p => [hip[0] + p[0], hip[1] + p[1]];
  const sh = [hip[0] + Math.sin(lean) * 168 * s, hip[1] - Math.cos(lean) * 168 * s];
  const hd = [sh[0] + Math.sin(lean * 1.3) * 64 * s, sh[1] - Math.cos(lean * 1.3) * 64 * s];
  const arm = p => {
    const ua = -Math.sin(p) * amp * .9, fb = .35 + .9 * run;
    const el = [sh[0] + Math.sin(ua) * 78 * s, sh[1] + Math.cos(ua) * 78 * s];
    return [sh, el, [el[0] + Math.sin(ua + fb) * 70 * s, el[1] + Math.cos(ua + fb) * 70 * s]];
  };
  return {
    head: [hd[0], hd[1], 36 * s],
    parts: [
      [[hip, at(B[0]), at(B[1])], 32 * s], [arm(ph + Math.PI), 20 * s],
      [[hip, sh], 54 * s],
      [[hip, at(A[0]), at(A[1])], 32 * s], [arm(ph), 20 * s]
    ]
  };
}

// ---------- the bedroom, in thin lines ----------
const BED = { x0: 600, x1: 1250, y: 760 };
const SIT = { x: 860, y: 760, s: 1.1 };
function drawWindow(m, a) {          // m: 0 night … 1 grey morning
  if (a <= .003) return;
  const x = 300, y = 220, w = 260, h = 290, v = Math.min(1, a * 4);
  ctx.fillStyle = rgba(mix([26, 34, 64], [176, 182, 192], m), (.12 + .4 * m) * v);
  ctx.fillRect(x, y, w, h);
  if (m > .01) {
    ctx.fillStyle = rgba([196, 200, 210], .06 * m * v);
    ctx.beginPath(); ctx.moveTo(x, 860); ctx.lineTo(x + w, 860); ctx.lineTo(x + w + 380, H); ctx.lineTo(x + 220, H); ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = rgba(C.cream, Math.min(1, a * 1.6)); ctx.lineWidth = 3;
  ctx.strokeRect(x, y, w, h); line(x + w / 2, y, x + w / 2, y + h); line(x, y + h / 2, x + w, y + h / 2);
}
function drawRoom(a, col) {
  if (a <= .003) return;
  ctx.strokeStyle = rgba(col, a); ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  line(0, 860, W, 860);                                                  // floor
  ctx.strokeRect(BED.x0, BED.y, BED.x1 - BED.x0, 64);                    // mattress
  line(BED.x0 + 14, BED.y + 64, BED.x0 + 14, 860); line(BED.x1 - 14, BED.y + 64, BED.x1 - 14, 860);
  rrect(BED.x0 - 26, BED.y - 160, 26, 224, 10); ctx.stroke();            // headboard
  ctx.strokeRect(1590, 330, 180, 530);                                   // door
  ctx.beginPath(); ctx.arc(1612, 610, 7, 0, Math.PI * 2); ctx.stroke();
  rrect(1462, 806, 104, 54, 16); ctx.stroke();                           // gym bag
  ctx.beginPath(); ctx.moveTo(1488, 806); ctx.quadraticCurveTo(1514, 770, 1540, 806); ctx.stroke();
  line(110, 650, 450, 650); line(130, 650, 130, 860); line(430, 650, 430, 860);   // desk
  ctx.strokeRect(240, 632, 96, 18);                                      // the book
}

// ---------- background, vignette, captions ----------
const SKY = [[0, C.black, C.black], [160, C.black, C.black]];
function drawSky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgba(keys(SKY, t, E.sine, 1))); g.addColorStop(1, rgba(keys(SKY, t, E.sine, 2)));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function drawVignette(t) {
  const beat = (t > 43 && t < 48.6) || (t > 59.2 && t < 60.6) ? .14 * Math.pow(Math.max(0, Math.sin(t * Math.PI * 2)), 12) : 0;   // slow heartbeat
  const v = keys([[0, .75], [60.6, .75], [61.3, .5], [78.8, .55], [95.5, .75]], t) + beat;
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * 1.02);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${clamp(v)})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const fb = inv(DUR - 1.4, DUR, t);
  if (fb > 0) { ctx.fillStyle = `rgba(0,0,0,${fb})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- the hero's face: cream features on the dark head ----------
const EXPR = {
  glazed:  { lid: .45, brow: 0, browH: 0, smile: 0, open: 0, grit: 0, gx: .3, gy: .6, tear: 0, sweat: 0 },
  tired:   { lid: .66, brow: .45, browH: -.04, smile: -.3, open: 0, grit: 0, gx: .2, gy: .7, tear: 0, sweat: 0 },
  empty:   { lid: .5, brow: .8, browH: .06, smile: -.55, open: 0, grit: 0, gx: 0, gy: .9, tear: .6, sweat: 0 },
  ashamed: { lid: .55, brow: .85, browH: .06, smile: -.6, open: 0, grit: 0, gx: -.8, gy: .7, tear: 0, sweat: 0 },
  shock:   { lid: 0, brow: .7, browH: .2, smile: -.25, open: .45, grit: 0, gx: 0, gy: 0, tear: 0, sweat: 0 },
  resolve: { lid: .18, brow: -.75, browH: -.04, smile: -.15, open: 0, grit: 0, gx: .5, gy: 0, tear: 0, sweat: 0 },
  strain:  { lid: .8, brow: -1, browH: -.08, smile: -.45, open: .35, grit: 1, gx: 0, gy: 0, tear: 0, sweat: 1 },
  focus:   { lid: .22, brow: -.4, browH: 0, smile: 0, open: 0, grit: 0, gx: .7, gy: 0, tear: 0, sweat: 0 },
  calm:    { lid: .32, brow: .15, browH: .04, smile: .45, open: 0, grit: 0, gx: .6, gy: -.1, tear: 0, sweat: 0 },

const SHOT_FN = {
  cold: shotCold, sting: shotSting, room: shotRoom, black: () => fill([2, 2, 3]), clock: shotClock, phone: shotPhone,
  face: (t, look) => faceShot(t, look), devilface: shotDevilFace, montage: shotMontage, reflection: shotReflection,
  shower: shotShower, run: shotRun, pushups: shotPushups, gym: shotGym, sleep: shotSleep, card: shotCard, mirror: shotMirror, end: shotEnd, title: shotTitle
};
const FLASH = { clock: [255, 255, 255], devilface: [255, 60, 60], sting: [255, 60, 60] };   // a two-frame flash on these cuts

// ---------- one frame ----------
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  setShake(t);
  let i = 0;
  while (i + 1 < SHOTS.length && t >= SHOTS[i + 1][0]) i++;
  const [t0, kind, p] = SHOTS[i], L = t - t0, len = (SHOTS[i + 1] ? SHOTS[i + 1][0] : DUR) - t0;
  PUSH = (1 + .07 * clamp(L / len)) * (p && p.z ? p.z : 1);
  SHOT_FN[kind](t, p, L);
  PUSH = 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (FLASH[kind] && L < .08) { ctx.fillStyle = rgba(FLASH[kind], .3 * (1 - L / .08)); ctx.fillRect(0, 0, W, H); }
  glitch(t);
  drawVignette(t);
  devilWords(t);
}

// ---------- playback controls ----------
let T = 0, playing = false, last = 0;
const btn = document.getElementById('play'), scrub = document.getElementById('scrub');
const tm = document.getElementById('time'), bar = document.getElementById('phases');
scrub.max = DUR;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
PHASES.forEach(p => {
  const b = document.createElement('button');
  b.textContent = p.name; b.onclick = () => { seek(p.a + .01); b.blur(); };
  p.btn = b; bar.appendChild(b);
});
function draw() {
  render(T);
  scrub.value = T; tm.textContent = `${fmt(T)} / ${fmt(DUR)}`;
  PHASES.forEach(p => p.btn.classList.toggle('on', T >= p.a && (T < p.b || p.b === DUR)));
}
function seek(s) { T = clamp(s, 0, DUR); draw(); }
function frame(now) {
  if (!playing) return;
  T = Math.min(DUR, T + Math.min(.1, (now - last) / 1000)); last = now;
  if (T >= DUR) { playing = false; btn.textContent = '▶'; }
  draw();
  if (playing) requestAnimationFrame(frame);
}
function toggle() {
  playing = !playing; btn.textContent = playing ? '❚❚' : '▶';
  if (playing) { if (T >= DUR) T = 0; last = performance.now(); requestAnimationFrame(frame); }
}
btn.onclick = () => { toggle(); btn.blur(); };
scrub.oninput = () => seek(+scrub.value);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.code === 'ArrowRight') seek(T + 5);
  else if (e.code === 'ArrowLeft') seek(T - 5);
});
window.renderAt = s => { T = clamp(s, 0, DUR); render(T); };   // for exporting frames to video
const jump = location.hash.match(/t=([\d.]+)/);
if (jump) T = clamp(+jump[1], 0, DUR);
draw();
</script>
