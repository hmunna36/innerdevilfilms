<!doctype html><html><head><meta charset="utf-8"><style>
html, body { margin: 0; background: #000; } canvas { display: block; }
</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script><script src="rig.js"></script><script src="cues.js"></script>
<script>
(async () => {
  try {
    await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = 'film.js'; s.onload = ok; s.onerror = () => bad(new Error('cannot load film.js')); document.head.appendChild(s); });
    await Promise.all(['700 40px "Chalkboard SE"', '400 40px "Chalkboard SE"'].map(f => document.fonts.load(f).catch(() => 0)));
    window.READY = true;
  } catch (e) { window.LOAD_ERROR = String(e && e.message || e); }
})();
const C = document.getElementById('c');
window.DRAW = t => { ctx = C.getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0; ctx.clearRect(0, 0, W, H); FILM(t || 0); };
// a contact sheet: n frames between a and b, cols across, each labelled with its time
window.SHEET = (times, cols, tw) => { const th = Math.round(tw * 9 / 16), rows = Math.ceil(times.length / cols), s = document.createElement('canvas'); s.width = cols * tw; s.height = rows * th; const g = s.getContext('2d');
  times.forEach((t, i) => { window.DRAW(t); const x = (i % cols) * tw, y = Math.floor(i / cols) * th; g.drawImage(C, x, y, tw, th); g.fillStyle = 'rgba(0,0,0,.7)'; g.fillRect(x, y, 74, 24); g.fillStyle = '#ff0'; g.font = '700 18px Menlo, monospace'; g.fillText(t.toFixed(2), x + 5, y + 18); g.strokeStyle = '#333'; g.strokeRect(x + .5, y + .5, tw, th); });
  return s.toDataURL('image/jpeg', .88).split(',')[1]; };
</script></body></html>
