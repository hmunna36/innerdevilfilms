<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: "IDF Hand"; font-weight: 700; src: url("fonts/IDFHand-Bold.ttf"); }
@font-face { font-family: "IDF Hand"; font-weight: 400; src: url("fonts/IDFHand-Regular.ttf"); }
html, body { margin: 0; background: #000; } canvas { display: block; }
</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// page.html?film=../films/NN-slug[&short=../shorts/NN-slug][&font=mac]   (paths from this folder; stage/render.mjs builds the URL)
// A film: lib, rig, kit, the film's cues.js and film.js (built from its src/ by build.sh). A Short adds vertical.js and
// the Short's short.js, and the canvas is 1080 x 1920.
const PQ = new URLSearchParams(location.search), FILMDIR = PQ.get('film'), SHORTDIR = PQ.get('short');
if (PQ.get('font') === 'mac') window.STAGE_FONT = '"Chalkboard SE", "Marker Felt", "Comic Sans MS", sans-serif';
const C = document.getElementById('c'); if (SHORTDIR) { C.width = 1080; C.height = 1920; }
const _need = src => new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.async = false; s.onload = ok; s.onerror = () => bad(new Error('cannot load ' + src)); document.head.appendChild(s); });
(async () => {
  try {
    for (const src of ['lib.js', 'rig.js', FILMDIR + '/cues.js', 'kit.js', FILMDIR + '/film.js', ...(SHORTDIR ? ['vertical.js', SHORTDIR + '/short.js'] : [])]) await _need(src);
    const fam = PQ.get('font') === 'mac' ? 'Chalkboard SE' : 'IDF Hand';
    await Promise.all([`700 40px "${fam}"`, `400 40px "${fam}"`].map(f => document.fonts.load(f).catch(() => 0)));
    window.FONT_OK = document.fonts.check(`700 40px "${fam}"`);
    window.DUR = SHORTDIR ? SHORT.dur : _et || CUE.END;
    window.READY = true;
  } catch (e) { window.LOAD_ERROR = String(e && e.message || e); }
})();
const _reset = () => { ctx = C.getContext('2d'); if (window.unbase) unbase(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0; ctx.clearRect(0, 0, C.width, C.height); };
window.DRAW = (t, o) => { _reset(); if (SHORTDIR) VFILM(t || 0, o); else FILM(t || 0); };
// a code-drawn thumbnail, 1280 x 720 (kit.js THUMB)
window.THUMBJPG = (t, word, hook, cam, pos) => { _reset(); THUMB(t, word, hook, cam, pos); const s = document.createElement('canvas'); s.width = 1280; s.height = 720; s.getContext('2d').drawImage(C, 0, 0, 1280, 720); return s.toDataURL('image/jpeg', .92).split(',')[1]; };
// a contact sheet: the frames at `times`, cols across, each labelled with its time (a Short's with the safe area drawn)
window.SHEET = (times, cols, tw, o) => { const th = Math.round(tw * C.height / C.width), rows = Math.ceil(times.length / cols), s = document.createElement('canvas'); s.width = cols * tw; s.height = rows * th; const g = s.getContext('2d');
  times.forEach((t, i) => { window.DRAW(t, o); const x = (i % cols) * tw, y = Math.floor(i / cols) * th; g.drawImage(C, x, y, tw, th); g.fillStyle = 'rgba(0,0,0,.7)'; g.fillRect(x, y, 74, 24); g.fillStyle = '#ff0'; g.font = '700 18px Menlo, monospace'; g.fillText(t.toFixed(2), x + 5, y + 18); g.strokeStyle = '#333'; g.strokeRect(x + .5, y + .5, tw, th); });
  return s.toDataURL('image/jpeg', .88).split(',')[1]; };
</script></body></html>
